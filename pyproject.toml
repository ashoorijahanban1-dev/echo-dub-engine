[project]
name = "rpim-dubbing-pipeline"
version = "2.0.0"
description = "RPIM TV Persian Dubbing, Telegram Storage Gateway, and Course Publishing Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.3",
    "python-multipart>=0.0.9",
    "edge-tts>=6.1.12",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
]

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.1.18",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["adapters", "workers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

